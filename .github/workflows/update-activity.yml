name: Update Activity Feed

on:
  schedule:
    # Once a day at 13:00 UTC (~9am ET / 6am PT). Adjust the cron if you
    # want a different time — this doesn't need to be more frequent since
    # the feed isn't meant to be real-time.
    - cron: '0 13 * * *'
  workflow_dispatch: {} # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write # needed to commit the updated cache file back to the repo

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-activity.js

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-cache.json
          git diff --cached --quiet || git commit -m "chore: update activity feed cache"
          git push
